name: Build React Native Android APK

# Builds a Release APK that talks to https://japasiddhi.onrender.com
# (same as iOS IPA). Debug Metro builds still use local backend.
#
# Trigger: push to main, or Actions → Build React Native Android APK → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - src/**
      - package.json
      - package-lock.json
      - index.js
      - .github/workflows/react-native-android.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Leave RAM for Metro/Hermes; CI runners are ~7GB.
      NODE_OPTIONS: --max-old-space-size=4096
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx1024m
      RNFB_SUPPRESS_NEW_ARCHITECTURE_WARNING: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle || true
          df -h

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew
          # Avoid CRLF shebang failures on Linux runners
          sed -i 's/\r$//' android/gradlew

      - name: Tune Gradle memory for CI
        run: |
          # Override local 4GB heap so Metro/Hermes and Gradle fit on ~7GB runners
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx1024m/' android/gradle.properties
          grep org.gradle.jvmargs android/gradle.properties

      - name: Verify release JS bundle
        run: |
          mkdir -p /tmp/japa-android-assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/japa-android.bundle \
            --assets-dest /tmp/japa-android-assets

      - name: Build Release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -PreactNativeArchitectures=arm64-v8a \
            2>&1 | tee ../android-release-build.log

      - name: Locate built APK
        id: find_apk
        if: success()
        run: |
          set -e
          echo "Searching for release APKs..."
          find android -type f -name "*.apk" -print || true
          APK="$(find android -type f -path "*/apk/release/*.apk" | head -n 1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find android -type f -name "*release*.apk" | head -n 1 || true)"
          fi
          if [ -z "$APK" ]; then
            echo "No release APK found after assembleRelease"
            exit 1
          fi
          echo "Found APK: $APK"
          mkdir -p artifacts
          cp "$APK" artifacts/japasiddhi-release.apk
          echo "apk=artifacts/japasiddhi-release.apk" >> "$GITHUB_OUTPUT"
          ls -lh artifacts/japasiddhi-release.apk

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: japasiddhi-release-apk
          path: artifacts/japasiddhi-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Dump failure diagnostics
        if: failure()
        run: |
          set +e
          echo "::group::Disk space"
          df -h
          echo "::endgroup::"
          if [ ! -f android-release-build.log ]; then
            echo "::error::android-release-build.log was not created"
            exit 0
          fi
          echo "::group::Gradle log (last 160 lines)"
          tail -n 160 android-release-build.log
          echo "::endgroup::"
          {
            echo "## Android Gradle failure"
            echo ""
            echo '```'
            # Prefer the root-cause section when present
            if grep -q "What went wrong:" android-release-build.log; then
              awk '
                /\* What went wrong:/ {p=1}
                p {print}
                /^\* Try:/ {if(p){exit}}
                /^BUILD FAILED/ {if(p){exit}}
              ' android-release-build.log | head -n 40
            else
              grep -E "^> Task .+ FAILED$|^FAILURE:|Execution failed for task" android-release-build.log | tail -n 40
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          FAILED_TASK=$(grep -E "^> Task .+ FAILED$" android-release-build.log | tail -n 1 | sed 's/^> Task //')
          if [ -n "$FAILED_TASK" ]; then
            echo "::error title=Failed Gradle task::${FAILED_TASK}"
          fi
          awk '
            /\* What went wrong:/ {p=1; next}
            p && (/^\* Try:/ || /^BUILD FAILED/) {exit}
            p {print}
          ' android-release-build.log | head -n 20 | while IFS= read -r line; do
            echo "::error title=What went wrong::${line}"
          done

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build-log
          path: android-release-build.log
          if-no-files-found: ignore
          retention-days: 7
