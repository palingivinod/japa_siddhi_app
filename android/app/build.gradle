// Keep outputs off locked android/app/build and android/build/out (Windows only).
def altAppBuild = System.getenv("JAPA_ANDROID_BUILD_DIR")
def isWindows = System.getProperty("os.name", "").toLowerCase().contains("windows")
if (altAppBuild) {
    layout.buildDirectory.set(file("${altAppBuild}/out/app"))
} else if (isWindows) {
    layout.buildDirectory.set(file("${rootDir}/build-r4/out/app"))
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.japasiddhi"
    defaultConfig {
        applicationId "com.japasiddhi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.0.6"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file("japasiddhi-release.keystore")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (keystorePropertiesFile.exists() && file("japasiddhi-release.keystore").exists()) {
                signingConfig signingConfigs.release
            } else {
                println("WARNING: android/keystore.properties or japasiddhi-release.keystore not found. Signing release APK with debug key.")
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // App Java (JapaFirebaseMessagingService) compiles against FCM types.
    // RNFirebase pulls these transitively at runtime, but not always for app javac.
    implementation platform("com.google.firebase:firebase-bom:33.14.0")
    implementation "com.google.firebase:firebase-messaging"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
