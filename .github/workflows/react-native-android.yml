name: Build React Native Android APK

# Builds a Release APK that talks to https://japasiddhi.onrender.com
# (same as iOS IPA). Debug Metro builds still use local backend.
#
# Trigger: push to main, or Actions → Build React Native Android APK → Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - src/**
      - package.json
      - package-lock.json
      - index.js
      - .github/workflows/react-native-android.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Leave RAM for Metro/Hermes; CI runners are ~7GB.
      NODE_OPTIONS: --max-old-space-size=4096
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx1024m
      RNFB_SUPPRESS_NEW_ARCHITECTURE_WARNING: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew
          # Avoid CRLF shebang failures on Linux runners
          sed -i 's/\r$//' android/gradlew

      - name: Tune Gradle memory for CI
        run: |
          # Override local 4GB heap so Metro/Hermes and Gradle fit on ~7GB runners
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx1024m/' android/gradle.properties
          grep org.gradle.jvmargs android/gradle.properties

      - name: Verify release JS bundle
        run: |
          mkdir -p /tmp/japa-android-assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/japa-android.bundle \
            --assets-dest /tmp/japa-android-assets

      - name: Build Release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -PreactNativeArchitectures=arm64-v8a \
            2>&1 | tee ../android-release-build.log

      - name: Locate built APK
        id: find_apk
        if: success()
        run: |
          set -e
          echo "Searching for release APKs..."
          find android -type f -name "*.apk" -print || true
          APK="$(find android -type f -path "*/apk/release/*.apk" | head -n 1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find android -type f -name "*release*.apk" | head -n 1 || true)"
          fi
          if [ -z "$APK" ]; then
            echo "No release APK found after assembleRelease"
            exit 1
          fi
          echo "Found APK: $APK"
          mkdir -p artifacts
          cp "$APK" artifacts/japasiddhi-release.apk
          echo "apk=artifacts/japasiddhi-release.apk" >> "$GITHUB_OUTPUT"
          ls -lh artifacts/japasiddhi-release.apk

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: japasiddhi-release-apk
          path: artifacts/japasiddhi-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Dump failure diagnostics
        if: failure()
        run: |
          echo "::group::Disk space"
          df -h
          echo "::endgroup::"
          if [ -f android-release-build.log ]; then
            echo "::group::Gradle log (last 200 lines)"
            tail -n 200 android-release-build.log
            echo "::endgroup::"
            # Surface root cause in the Checks UI / annotations API
            python3 - <<'PY'
          from pathlib import Path
          text = Path("android-release-build.log").read_text(errors="ignore")
          markers = [
              "What went wrong:",
              "Execution failed for task",
              "FAILURE: Build failed with an exception.",
              "* What went wrong:",
          ]
          start = -1
          for m in markers:
              i = text.rfind(m)
              if i > start:
                  start = i
          snippet = text[start:] if start >= 0 else text[-4000:]
          snippet = snippet.strip()[:3500].replace("\r", "")
          for line in snippet.splitlines()[:80]:
              # GitHub annotations: one ::error:: line
              safe = line.replace("%", "%25").replace("\r", "").replace("\n", "")
              print(f"::error title=Android Gradle::{safe}")
          PY
          else:
            echo "android-release-build.log missing"
          find android -type f \( -name "*.log" -o -name "hs_err_pid*.log" \) -print 2>/dev/null | head -n 50 || true

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build-log
          path: android-release-build.log
          if-no-files-found: ignore
          retention-days: 7
