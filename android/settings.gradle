pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'JapaSiddhi'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// Set build dirs before Android plugin apply so AGP does not lock onto
// android/app/build (that tree can be unreadable on this Windows machine).
gradle.beforeProject { project ->
    def altBuild = System.getenv("JAPA_ANDROID_BUILD_DIR")
    if (altBuild) {
        project.layout.buildDirectory.set(project.file("${altBuild}/out/${project.name}"))
    }
}
