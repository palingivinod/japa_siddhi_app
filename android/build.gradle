buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.3")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
    def altBuild = System.getenv("JAPA_ANDROID_BUILD_DIR")
    def buildRoot = altBuild ?: "${rootProject.projectDir}/build-r4"
    subproject.layout.buildDirectory.set(
        file("${buildRoot}/out/${subproject.name}")
    )

    // Keep CMake .cxx off locked node_modules/<lib>/android/.cxx
    def relocateCmake = {
        try {
            subproject.android.externalNativeBuild.cmake.buildStagingDirectory =
                file("${buildRoot}/cxx/${subproject.name}")
        } catch (Throwable ignored) {
        }
    }
    subproject.pluginManager.withPlugin("com.android.library", relocateCmake)
    subproject.pluginManager.withPlugin("com.android.application", relocateCmake)

    subproject.tasks.configureEach { task ->
        // Old architecture does not need screens CMake; the .so output folder gets locked on this PC.
        if (subproject.name.contains("react-native-screens") && task.name.contains("CMake")) {
            task.enabled = false
        }
    }
}
