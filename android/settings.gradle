pluginManagement {
  // Windows: node_modules/@react-native/gradle-plugin can be EPERM-locked.
  // Prefer JAPA_RN_GRADLE_PLUGIN, then a known clean temp copy, then node_modules.
  // A leftover temp folder without settings.gradle.kts must not win — Gradle
  // then cannot see com.facebook.react.settings.
  def envPath = System.getenv("JAPA_RN_GRADLE_PLUGIN")
  def tempPath = "${System.getenv('LOCALAPPDATA')}\\Temp\\rn-gp-0.81.0\\package"
  def nodePath = "../node_modules/@react-native/gradle-plugin"
  def rnGp = file(nodePath).absolutePath
  for (def c : [envPath, tempPath, nodePath]) {
    if (c == null || c.toString().trim().isEmpty()) {
      continue
    }
    def dir = file(c.toString())
    def hasSettings = new File(dir, "settings.gradle.kts").exists() || new File(dir, "settings.gradle").exists()
    if (dir.exists() && hasSettings) {
      rnGp = dir.absolutePath
      break
    }
  }
  System.setProperty("japa.rn.gradle.plugin", rnGp)
  includeBuild(rnGp)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'JapaSiddhi'
include ':app'
includeBuild(System.getProperty("japa.rn.gradle.plugin"))

// Only relocate when JAPA_ANDROID_BUILD_DIR is set.
// Never move the root project build dir — RN writes autolinking.json there
// (android/build/generated/autolinking/) and autolinkLibrariesWithApp() reads it.
gradle.beforeProject { project ->
    def altBuild = System.getenv("JAPA_ANDROID_BUILD_DIR")
    if (!altBuild || project == project.rootProject) {
        return
    }
    project.layout.buildDirectory.set(project.file("${altBuild}/out/${project.name}"))
}
