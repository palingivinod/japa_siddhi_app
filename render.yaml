services:
  - type: web
    name: japasiddhi-api
    runtime: node
    rootDir: JapaSiddhi-Backend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    scaling:
      minInstances: 2
      maxInstances: 5
      targetMemoryPercent: 70
      targetCPUPercent: 60
    envVars:
      # better-sqlite3 ships a Node-API binary that needs Node 22 or newer.
      # Pinned so a default-version change never breaks the database driver.
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: japasiddhi-database
          property: connectionString
      - key: UPLOAD_PATH
        value: uploads
      # Must stay stable across deploys or every user session is invalidated.
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: VEDICORBIT_API_BASE_URL
        value: https://vedicorbit-website.vercel.app/api/panchangam
      - key: VEDICORBIT_LAT
        value: "17.385"
      - key: VEDICORBIT_LON
        value: "78.4867"
      - key: VEDICORBIT_TIMEZONE
        value: Asia/Kolkata
      - key: VEDICORBIT_LANG
        value: en
      # Set this secret in the Render dashboard (do not commit the live key).
      - key: VEDICORBIT_API_KEY
        sync: false
