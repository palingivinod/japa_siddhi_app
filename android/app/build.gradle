// Keep outputs off locked android/app/build (Windows only).
// Must stay on the same drive as the project — C: vs E: breaks Gradle
// ("this and base files have different roots"). Prefer build-r7 (build-r6 often locked).
def isWindows = System.getProperty("os.name", "").toLowerCase().contains("windows")
def winDefaultBuild = file("${rootDir}/build-r7")
def altRaw = System.getenv("JAPA_ANDROID_BUILD_DIR")
def altAppBuild = null
if (altRaw != null && !altRaw.trim().isEmpty()) {
    def altFile = file(altRaw.trim())
    // Ignore cross-drive overrides (common LocalAppData on C: with project on E:).
    if (altFile.absolutePath.substring(0, 1).equalsIgnoreCase(winDefaultBuild.absolutePath.substring(0, 1))) {
        altAppBuild = altFile
    }
}
if (altAppBuild != null) {
    layout.buildDirectory.set(file("${altAppBuild}/out/app"))
} else if (isWindows) {
    layout.buildDirectory.set(file("${winDefaultBuild}/out/app"))
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.japasiddhi"
    defaultConfig {
        applicationId "com.japasiddhi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 25
        versionName "1.1.2"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file("japasiddhi-release.keystore")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (keystorePropertiesFile.exists() && file("japasiddhi-release.keystore").exists()) {
                signingConfig signingConfigs.release
            } else {
                println("WARNING: android/keystore.properties or japasiddhi-release.keystore not found. Signing release APK with debug key.")
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            ndk {
                // arm64 for modern phones; armeabi-v7a for older 32-bit devices.
                // Play serves each device only its matching ABI from the AAB.
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // App Java (JapaFirebaseMessagingService) compiles against FCM types.
    // RNFirebase pulls these transitively at runtime, but not always for app javac.
    implementation platform("com.google.firebase:firebase-bom:33.14.0")
    implementation "com.google.firebase:firebase-messaging"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
